name: Scheduled Test Coverage

on:
  push:
    branches: [main, master]
  schedule:
    - cron: "0 4 * * 1" # Every Monday

jobs:
  scheduled-coverage:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@0a44ba7841725637a19e28fa30b79a866c81b0a6 # v4.0.4
        with:
          node-version: 22
          

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Capture test coverage (not a performance benchmark)
        run: |
          set -o pipefail
          echo "Collecting test coverage; no competitive performance claim."
          node --test --experimental-test-coverage "dist/**/*.test.js" 2>&1 | tee test-coverage-results.txt

      - name: Store test coverage results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-coverage-results
          path: test-coverage-results.txt
