name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # Node 24 = current LTS; node:sqlite (storage/coordination)
        # requires >= 22.5. Node 20 is EOL and not covered.
        node-version: [22, 24]
      fail-fast: false

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@0a44ba7841725637a19e28fa30b79a866c81b0a6 # v4.0.4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Static quality and type checks (includes platform process-policy guard)
        run: npm run lint

      - name: Build
        run: npm run build

      - name: SDK typecheck
        run: npm run typecheck:sdk

      - name: Public documentation and packaging checks
        run: |
          node scripts/check-public-docs.mjs
          node --test scripts/public-release.test.mjs

      - name: Runtime and contract test suites
        run: npm test

      # Focused security/platform gates — run separately so a failure is
      # attributable to a specific security surface, not lost in the full suite.
      - name: Focused platform and process security tests
        run: npm run build && node --test "dist/platform/platform.test.js" "dist/tools/terminal.test.js" "dist/tools/git-status.test.js"

      - name: Focused skill discovery, privacy, and sandbox tests
        run: node --test "dist/skills/discovery/discovery.test.js" "dist/skills/discovery/search.test.js" "dist/skills/execution-profile.test.js" "dist/skills/sandbox-runtime.test.js"

      - name: Focused isolation and recovery tests
        run: node --test "dist/isolation/isolation.test.js" "dist/storage/coordination.test.js" "dist/runtime/interrupted-recovery.test.js"

      - name: SDK checks
        run: npm --prefix sdk test

  # Linux/macOS arm64 verification: the canonical architecture for ARM
  # servers and Apple Silicon. x64 emulation for arm64 is too slow for the
  # full suite; run the focused platform/coordination gates that encode
  # OS-specific behavior.
  arm64-focused:
    strategy:
      matrix:
        include:
          - os: ubuntu-24.04-arm
            label: linux-arm64
          - os: macos-14
            label: macos-arm64
      fail-fast: false

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js 24
        uses: actions/setup-node@0a44ba7841725637a19e28fa30b79a866c81b0a6 # v4.0.4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint and build
        run: npm run lint && npm run build

      - name: Focused platform, path-security, and process tests
        run: node --test "dist/platform/platform.test.js" "dist/tools/terminal.test.js" "dist/tools/git-status.test.js"

      - name: Focused multi-process coordination tests
        run: node --test "dist/storage/coordination.test.js"

  # Installer smoke test: builds the real tarball, installs it into a clean
  # directory, and exercises the production CLI surface on every supported
  # OS/arch combination. This is the closest CI proxy to the fresh-machine
  # test (real npm publish happens only in the release workflow).
  installer-smoke:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [22, 24]
      fail-fast: false

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@0a44ba7841725637a19e28fa30b79a866c81b0a6 # v4.0.4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Build and pack distribution tarball
        run: |
          npm ci
          npm run build
          # npm pack does not create --pack-destination; make it first
          # (node one-liner is portable across the pwsh/bash default shells).
          node -e "require('node:fs').mkdirSync('release',{recursive:true})"
          npm pack --pack-destination "$PWD/release"
      - name: Install into clean directory
        shell: bash
        run: |
          mkdir "$RUNNER_TEMP/smoke" && cd "$RUNNER_TEMP/smoke"
          npm init -y >/dev/null
          npm install "$GITHUB_WORKSPACE/release/"*.tgz --no-audit --no-fund
      - name: CLI smoke test (fresh home)
        shell: bash
        env:
          QUACK_HOME: ${{ runner.temp }}/smoke/quack-home
        run: |
          CLI="node_modules/@quack/os/dist/cli.js"
          node "$CLI" --version
          node "$CLI" init
          node "$CLI" doctor --json | grep -q '"ready": true'
          node "$CLI" status
          node "$CLI" config
      - name: bash installer fail-closed syntax check
        if: runner.os != 'Windows'
        run: bash -n installers/install.sh && echo "install.sh syntax OK"

      # The Pages-served installer copies (website/) are what users actually
      # pipe to a shell — they must never drift from installers/.
      - name: Installer copy drift check
        if: runner.os == 'Linux'
        run: |
          diff installers/install.sh website/install.sh
          diff installers/install.ps1 website/install.ps1
