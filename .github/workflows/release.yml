name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install locked dependencies
        run: npm ci
      - name: Validate source and documentation
        run: |
          npm run lint
          node scripts/check-public-docs.mjs
          node --test scripts/public-release.test.mjs
      - name: Run current test suite
        run: npm test
      - name: Validate SDK
        run: npm --prefix sdk test
      - name: Assemble isolated public candidate
        run: npm run package:windows
      - name: Create draft GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          draft: true
          body_path: CHANGELOG.md
          files: |
            release/run-*/*.zip
            release/run-*/*.sha256
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
