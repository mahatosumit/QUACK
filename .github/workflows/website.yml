name: Website

# Deploys the static QUACK website (website/) to GitHub Pages, which serves
# https://quack.os (see website/CNAME). The Pages-served installer copies
# (website/install.sh, website/install.ps1) are kept in sync with installers/
# by the CI "Installer copy drift check"; they must be byte-identical.

on:
  push:
    branches: [main, master]
    paths: ["website/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      # Guard before publishing: the installer copies users pipe to a shell
      # must never drift from the reviewed installers/ source.
      - name: Installer copy drift check
        run: |
          diff installers/install.sh website/install.sh
          diff installers/install.ps1 website/install.ps1

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: website

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
